[project]
name = "arkenos-agent"
version = "0.1.0"
description = "Arkenos Voice Agent — STT, LLM, and TTS orchestration runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.5.0",
    "livekit-plugins-deepgram>=1.5.0",
    "livekit-plugins-assemblyai>=1.5.0",
    "livekit-plugins-elevenlabs>=1.5.0",
    "livekit-plugins-resemble>=1.5.0",
    "livekit-plugins-silero>=1.5.0",
    "livekit-plugins-google>=1.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
py-modules = ["agent", "resemble_tts"]
