# Nenyax Production Docker Compose
#
# Used by install.sh for VPS deployment.
# All credentials are auto-generated — see .env file.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

name: nenyax

services:
  # ============================================
  # Caddy — Reverse Proxy + Auto HTTPS
  # ============================================
  caddy:
    image: caddy:2-alpine
    container_name: nenyax-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: nenyax-db
    environment:
      POSTGRES_DB: nenyax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # MinIO Object Storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: nenyax-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nenyax-backend
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FRONTEND_URL: ${ARKENOS_URL:-http://localhost}
      CONTAINER_BACKEND_URL: http://nenyax-backend:8000/api
      DOCKER_SOCKET: unix:///var/run/docker.sock
      CONTAINER_NETWORK: nenyax_default
      DEBUG: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Voice Agent (LiveKit — standard agent)
  # ============================================
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: nenyax-agent
    environment:
      BACKEND_API_URL: http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================
  # Frontend (Next.js)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${ARKENOS_URL:-http://localhost}/api
    container_name: nenyax-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${ARKENOS_URL:-http://localhost}/api
      INTERNAL_API_URL: http://backend:8000/api
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/nenyax
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${ARKENOS_URL:-http://localhost}
      NEXT_PUBLIC_TELEMETRY: "false"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
